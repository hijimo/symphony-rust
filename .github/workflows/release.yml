name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/hijimo/symphony:latest
            ghcr.io/hijimo/symphony:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  checksums:
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate checksums
        run: |
          sha256sum deploy/scripts/install.sh > install.sh.sha256
      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            deploy/scripts/install.sh
            deploy/scripts/upgrade.sh
            deploy/scripts/backup.sh
            install.sh.sha256
            deploy/docker-compose.yml
            deploy/.env.example


  # Organization rules eval runner (P3 design §5 E2), downloaded by the CI
  # templates in deploy/org-config-template/.
  symphony-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p web-platform --bin symphony-eval
      - name: Package
        run: |
          asset=symphony-eval-x86_64-unknown-linux-gnu.tar.gz
          tar -czf "$asset" -C target/release symphony-eval
          sha256sum "$asset" > "$asset.sha256"
      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            symphony-eval-x86_64-unknown-linux-gnu.tar.gz
            symphony-eval-x86_64-unknown-linux-gnu.tar.gz.sha256
